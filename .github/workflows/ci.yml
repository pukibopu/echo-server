name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting (clang-format 22)
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 --no-run-if-empty clang-format-22 --dry-run --Werror

  build:
    name: build-test (${{ matrix.preset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: echo
          MYSQL_USER: echo
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MYSQL_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7

      - name: Remove the runner's MySQL client headers
        run: |
          sudo apt-get remove -y libmysqlclient-dev
          test ! -e /usr/include/mysql/mysql.h

      - name: Set up vcpkg at the pinned baseline
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout --quiet "$baseline"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit

      - name: Integration tests
        run: ctest --preset ${{ matrix.preset }} -L integration

      - name: Smoke test GET /healthz
        if: matrix.preset == 'debug'
        run: |
          ./build/debug/apps/platform/echo-platform config/platform.example.json &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/healthz | tee /dev/stderr | jq -e '.status == "ok"'

      - name: clang-tidy
        if: matrix.preset == 'debug'
        run: run-clang-tidy-22 -clang-tidy-binary clang-tidy-22 -p build/debug -quiet -warnings-as-errors='*' '/(apps|libs)/'
